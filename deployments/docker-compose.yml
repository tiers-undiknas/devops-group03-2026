name: devops-group03-2026

services:
  # 1. PostgreSQL (Sesuai soal: image postgres:16-alpine, volume pgdata, healthcheck pg_isready)
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # 2. Redis (Sesuai soal: image redis:7-alpine, healthcheck redis-cli ping)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network

  # 3. API (Sesuai soal: REST API port 3000, depends_on condition: service_healthy)
  api:
    build:
      context: ../backend
      target: runtime
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy # Poin Penting Rubrik!
      redis:
        condition: service_healthy # Poin Penting Rubrik!
    networks:
      - app-network

  # 4. Worker (Sesuai soal: Layanan asinkronus TANPA eksposur port eksternal)
  worker:
    build:
      context: ../backend
      target: runtime
    restart: unless-stopped
    command: [ "node", "src/worker.js" ] # Menjalankan script worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  # 5. Frontend (Sesuai soal: Dashboard port 80/8080, jaringan internal bridge)
  frontend:
    build:
      context: ../frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_started
    networks:
      - app-network

# Sesuai soal: Persistensi data relasional menggunakan Named Volume
volumes:
  pgdata:
    driver: local

# Sesuai soal: Isolasi jaringan privat (bridge network)
networks:
  app-network:
    driver: bridge
