server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA Fallback (Untuk routing Vite)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy ke API Backend (Port 3000)
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Reverse Proxy untuk Health Check
    location /healthz/ {
        proxy_pass http://api:3000/healthz/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Reverse Proxy untuk Prometheus Metrics (Ada di kode UI)
    location /metrics {
        proxy_pass http://api:3000/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}